batch_checks:
  auto_check_batch: true
  volume:
    enabled: true
    history_window_batches: 14
    minimum_history_batches: 3
    min_volume_ratio: 0.30
    max_volume_ratio: 3.00
    fallback_absolute_min_rows: 1
    fallback_absolute_max_rows: 5000000

  missing_scopes:
    enabled: true
    lookback_batches: 7
    severity: "WARNING"

  freshness:
    enabled: true
    event_time_role: "pickup_time"
    max_lag_seconds: 172800
    severity: "WARNING"

  alerts:
    cooldown_seconds: 3600
    auto_close_healthy_batches: 3
    destinations:
      log: true
      table: true
      webhook: false

  diagnostics:
    enabled: true
    max_source_share: 0.80
    max_day_share: 0.80

bench:
  history_days: 3
  trips_per_city_day: 50
  seed: 42
  source: "nyc_tlc_feed"
  output_dir: "data/benchmark"
  reports_json: "reports/benchmark.json"
  reports_md: "reports/benchmark.md"
  replay_recovery:
    fault_name: "swapped_times"
    fix_type: "config"
    loosened_rule_id: "RULE_CHRONOLOGY"
